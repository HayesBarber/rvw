name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build signed release
        env:
          RVW_CERTIFICATE_BASE64: ${{ secrets.RVW_CERTIFICATE_BASE64 }}
          RVW_CERTIFICATE_PASSWORD: ${{ secrets.RVW_CERTIFICATE_PASSWORD }}
          RVW_SIGNING_IDENTITY: ${{ secrets.RVW_SIGNING_IDENTITY }}
          RVW_NOTARY_KEY_BASE64: ${{ secrets.RVW_NOTARY_KEY_BASE64 }}
          RVW_NOTARY_KEY_ID: ${{ secrets.RVW_NOTARY_KEY_ID }}
          RVW_NOTARY_ISSUER_ID: ${{ secrets.RVW_NOTARY_ISSUER_ID }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_ENV"
          zig build -Drelease=true -Dversion="${VERSION}" -Doptimize=ReleaseFast

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "zig-out/release/Rvw-${{ env.version }}.zip" "zig-out/release/Rvw-${{ env.version }}.zip.sha256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "zig-out/release/Rvw-${{ env.version }}.zip" "zig-out/release/Rvw-${{ env.version }}.zip.sha256" \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
